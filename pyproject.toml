[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-registry-reference"
version = "0.1.0"
description = "Reference implementation of an enterprise AI agent registry with reconciliation, gateway enforcement and governance reporting"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-registry = "agent_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
