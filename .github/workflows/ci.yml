name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Python tests
        run: pytest -q

      - name: Registry schema and ownership checks
        run: agent-registry validate --as-of 2026-11-10

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Policy format and tests
        run: |
          opa fmt --fail --list policy/
          opa test policy/ -v

      - name: Report is reproducible
        run: |
          agent-registry report --as-of 2026-11-10 || true
          git diff --exit-code reports/
